group 'com.selfsign.webview.selfsign_webview_flutter'
version '0.1.0'

buildscript {
    ext.kotlin_version = '1.9.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// ── Built-in Kotlin 遷移（愛生育 App fork）────────────────────────────────────
// 本模組**不再套用 KGP**，Kotlin 由 AGP 9 的 built-in Kotlin 編譯。
// 這是 Flutter 對 plugin 作者的正式指引（migrate-to-built-in-kotlin/for-plugin-authors）。
//
// 為什麼連「有條件套用」都不留：Flutter 的 FlutterPluginUtils 是用**正則比對
// build script 的字面文字**來判斷一個 plugin 有沒有套用 KGP（其原始碼註解明說刻意
// 不查執行期狀態，因為動態判斷會有 Gradle 生命週期問題）。只要檔案裡出現行首的
// KGP 宣告，即使被包在永遠不成立的 if 裡，仍會被列進警告名單。
// 要真正消除，就必須讓那行宣告消失，而不是讓它不執行。
//
// ⚠️ 因此本 fork 要求 **AGP >= 9，且 gradle.properties 的 built-in Kotlin 開關為 true**。
//    愛生育 App 兩者皆成立。若未來在該開關為 false 的環境使用本 fork，.kt 將完全
//    不會被編譯，症狀是宿主 app 的 GeneratedPluginRegistrant.java 報 cannot find symbol。

android {
    namespace 'com.selfsign.webview.selfsign_webview_flutter'
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 21
    }

    dependencies {
        implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
        implementation 'androidx.appcompat:appcompat:1.6.1'
        implementation 'androidx.core:core-ktx:1.12.0'
        implementation 'com.google.android.material:material:1.10.0'
    }
}
