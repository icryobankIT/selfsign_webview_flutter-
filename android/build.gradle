group 'com.selfsign.webview.selfsign_webview_flutter'
version '0.1.0'

buildscript {
    ext.kotlin_version = '1.9.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// ── AGP 9 built-in Kotlin 相容（愛生育 App fork 新增）──────────────────────────
// AGP 9 起 Kotlin 編譯可由 AGP 自己提供（built-in Kotlin）。此時若再 apply KGP，
// AGP 會直接硬失敗：「Remove the 'org.jetbrains.kotlin.android' plugin from this
// project's build file」。但 Flutter 的 migrator 可能把 android.builtInKotlin 設為
// false（本專案目前就是），那時仍必須自行 apply KGP，否則這個模組的 .kt 完全不會
// 被編譯 —— 症狀是宿主 app 的 GeneratedPluginRegistrant.java 報 cannot find symbol。
// 判斷式與 firebase_performance 0.11.4+2 的官方寫法一致。
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlin = providers.gradleProperty("android.builtInKotlin")
        .map { it.toBoolean() }
        .orElse(agpMajor >= 9)
        .get()
if (agpMajor < 9 || !builtInKotlin) {
    apply plugin: 'kotlin-android'
}

android {
    namespace 'com.selfsign.webview.selfsign_webview_flutter'
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // kotlinOptions 是 KGP 掛在 android {} 上的擴充；AGP 9.0 已移除
    // android.kotlinOptions，走 built-in Kotlin 時沒有這個區塊，寫了會
    // Unresolved reference。built-in Kotlin 會自動對齊 compileOptions 的 Java target。
    if (agpMajor < 9 || !builtInKotlin) {
        kotlinOptions {
            jvmTarget = '1.8'
        }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 21
    }

    dependencies {
        implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
        implementation 'androidx.appcompat:appcompat:1.6.1'
        implementation 'androidx.core:core-ktx:1.12.0'
        implementation 'com.google.android.material:material:1.10.0'
    }
}
